<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neural AI Chat</title>

<style>
:root{
  --bg:#070b18;
  --panel:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.12);
  --accent:#7c5cff;
  --text:#e9ecff;
  --muted:#a8b0d6;
  --danger:#ff4d6d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,Arial;
}

body{
  height:100vh;
  display:flex;
  background:radial-gradient(circle at 20% 20%, #1a2a55, var(--bg));
  color:var(--text);
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:var(--panel);
  border-right:1px solid var(--stroke);
  backdrop-filter: blur(18px);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.title{
  font-size:18px;
  font-weight:700;
}

label{
  font-size:12px;
  color:var(--muted);
}

input{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,0.25);
  color:var(--text);
  outline:none;
}

.btn{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,var(--accent),#4fd1ff);
  transition:0.2s;
}
.btn:hover{transform:scale(1.03);}

.small{
  font-size:12px;
  padding:8px;
  background:rgba(255,255,255,0.08);
  border:1px solid var(--stroke);
}

/* CHAT */
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  padding:18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  max-width:75%;
  padding:12px;
  border-radius:14px;
  animation:pop 0.15s ease;
  line-height:1.4;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#6a5cff,#4fd1ff);
}

.ai{
  align-self:flex-start;
  background:rgba(255,255,255,0.07);
  border:1px solid var(--stroke);
}

.system{
  align-self:center;
  font-size:12px;
  color:var(--muted);
}

.error{
  background:var(--danger);
}

@keyframes pop{
  from{transform:scale(0.97);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* INPUT */
.inputbar{
  display:flex;
  gap:10px;
  padding:12px;
  border-top:1px solid var(--stroke);
  background:rgba(0,0,0,0.25);
}

textarea{
  flex:1;
  resize:none;
  height:50px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,0.05);
  color:var(--text);
  outline:none;
}

/* CODE BLOCKS */
.codebox{
  position:relative;
  background:#0b1020;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  padding:12px;
  margin-top:8px;
  overflow:auto;
}

.copybtn{
  position:absolute;
  top:8px;
  right:8px;
  font-size:11px;
  padding:4px 8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:var(--accent);
  color:white;
}

pre{
  margin:0;
  font-family:monospace;
  white-space:pre-wrap;
}

.ai strong{color:white;}
.ai h1,.ai h2,.ai h3{margin:6px 0;}
</style>
</head>

<body>

<div class="sidebar">
  <div class="title">⚡ AI Engine</div>

  <label>API URL</label>
  <input id="url" placeholder="http://127.0.0.1:1234/v1/chat/completions"/>

  <div style="display:flex;gap:6px;">
    <button class="btn small" onclick="preset('lim')">NVIDIA LIM</button>
    <button class="btn small" onclick="preset('lm')">LM Studio</button>
    <button class="btn small" onclick="preset('ollama')">Ollama</button>
  </div>

  <label>API Key (optional)</label>
  <input id="key" placeholder="sk-..."/>

  <label>Model</label>
  <input id="model" placeholder="model name"/>

  <button class="btn" onclick="save()">Save</button>

  <div style="font-size:11px;color:var(--muted)">
    Rate limit: 40 req / min
  </div>
</div>

<div class="chat">
  <div class="messages" id="messages"></div>

  <div class="inputbar">
    <textarea id="input" placeholder="Type message..."></textarea>
    <button class="btn" onclick="send()">Send</button>
  </div>
</div>

<script>
let cfg = {};
let times = [];
const LIMIT = 40;
const WINDOW = 60000;

/* ---------------- CONFIG ---------------- */

function preset(t){
  if(t==="lim") document.getElementById("url").value="http://127.0.0.1:8000/v1/chat/completions";
  if(t==="lm") document.getElementById("url").value="http://127.0.0.1:1234/v1/chat/completions";
  if(t==="ollama") document.getElementById("url").value="http://127.0.0.1:11434/v1/chat/completions";
}

function save(){
  cfg = {
    url: url.value,
    key: key.value,
    model: model.value
  };
  localStorage.setItem("ai_cfg", JSON.stringify(cfg));
  sys("Saved");
}

function load(){
  let s = localStorage.getItem("ai_cfg");
  if(s){
    cfg = JSON.parse(s);
    url.value = cfg.url||"";
    key.value = cfg.key||"";
    model.value = cfg.model||"";
  }
}

/* ---------------- RATE ---------------- */

function clean(){
  let now = Date.now();
  times = times.filter(t=>now-t<WINDOW);
}

/* ---------------- UI ---------------- */

function add(text,type){
  let d=document.createElement("div");
  d.className="msg "+type;

  if(type==="ai"){
    d.innerHTML="";
    typeWrite(d, render(text));
  } else d.textContent=text;

  messages.appendChild(d);
  messages.scrollTop=1e9;
  return d;
}

function sys(t){
  let d=document.createElement("div");
  d.className="msg system";
  d.textContent=t;
  messages.appendChild(d);
}

/* ---------------- TYPEWRITER ---------------- */

function typeWrite(el,html){
  let i=0,out="";
  function step(){
    if(i<html.length){
      out+=html[i];
      el.innerHTML=out;
      i++;
      setTimeout(step,5);
    }
  }
  step();
}

/* ---------------- MARKDOWN ---------------- */

function render(t){
  if(!t) return "";

  t = t.replace(/</g,"&lt;").replace(/>/g,"&gt;");

  // code blocks
  t = t.replace(/```([\s\S]*?)```/g,(m,code)=>{
    let id="c"+Math.random().toString(36).slice(2);

    setTimeout(()=>{
      let el=document.getElementById(id);
      if(el){
        el.innerHTML=`
          <button class="copybtn" onclick="navigator.clipboard.writeText(this.nextElementSibling.innerText)">Copy</button>
          <pre><code>${code}</code></pre>
        `;
      }
    },0);

    return `<div class="codebox" id="${id}">Loading...</div>`;
  });

  // bold
  t=t.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");

  // headings
  t=t.replace(/^### (.*$)/gm,"<h3>$1</h3>");
  t=t.replace(/^## (.*$)/gm,"<h2>$1</h2>");
  t=t.replace(/^# (.*$)/gm,"<h1>$1</h1>");

  return t.replace(/\n/g,"<br>");
}

/* ---------------- SEND ---------------- */

async function send(){
  let text=input.value.trim();
  if(!text) return;

  clean();
  if(times.length>=LIMIT){
    sys("Rate limit reached (40/min)");
    return;
  }

  times.push(Date.now());

  add(text,"user");
  input.value="";

  let loading=add("","ai");

  try{
    let r=await fetch(cfg.url,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        ...(cfg.key?{"Authorization":"Bearer "+cfg.key}:{})
      },
      body:JSON.stringify({
        model:cfg.model,
        messages:[
          {role:"system",content:"Format responses using markdown with proper code blocks."},
          {role:"user",content:text}
        ]
      })
    });

    let d=await r.json();
    loading.remove();

    let out=d?.choices?.[0]?.message?.content||"No response";
    add(out,"ai");

  }catch(e){
    loading.remove();
    add("Error: "+e.message,"error");
  }
}

load();
</script>

</body>
</html>
